<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectFreelas</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>

<body>

    <header>
        <div class="cabecalho-pagina">
            <div class="logo">
                <figure>
                    <img class="logo" src="../Imagems/Logo ConnectFreelas em Azul e Branco.png"
                        alt="Logo ConnectFreelas">
                </figure>
            </div>

            <div class="Buscar">
                <svg class="icone-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <input type="search" placeholder="Buscar projetos, freelancers ou habilidades..." aria-label="Buscar">
            </div>

            <div class="acoes">
                <button type="button" class="btn-notificacoes" aria-label="Notificações">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
                    </svg>
                </button>

                <button type="button" class="btn-perfil" aria-label="Perfil">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" />
                    </svg>
                </button>
            </div>
        </div>

    </header>

    <div class="menu">
        <nav>
            <ul>
                <li>
                    <a href="index.html" class="inicio-item">
                        <svg class="icone-inicio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="m3 10 9-7 9 7" />
                            <path d="M5 9v12h14V9" />
                            <path d="M9 21v-8h6v8" />
                        </svg>
                        Início
                    </a>
                </li>
                <hr>
                <li>
                    <a href="explorar.html" class="explorar-item">
                        <svg class="icon-explorar" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <circle cx="12" cy="12" r="10" />
                            <polygon points="16.2 7.8 14 14 7.8 16.2 10 10 16.2 7.8" />

                        </svg>
                        Explorar
                    </a>
                </li>

                <hr>

                <li>
                    <a href="meusprojetos.html" class="projetos-item">
                        <svg class="icon-projetos" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />

                        </svg>
                        Meus Projetos
                    </a>
                </li>

                <hr>

                <li>
                    <a href="mensagens.html" class="mensagem-item">
                        <svg class="icon-mensagem" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path d="M3 8l9 6 9-6" />

                        </svg>
                        Mensagens
                    </a>
                </li>
                <hr>
                <li>
                    <a href="favoritos.html" class="favoritos-item">
                        <svg class="icon-favoritos" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

                            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0 L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8 l1.1 1.1L12 21l7.8-7.5 1.1-1.1 a5.5 5.5 0 0 0-.1-7.8z" />

                        </svg>Favoritos
                    </a>
                </li>
                <hr>
            </ul>
        </nav>
    </div>

    <main>

        <div class="banner">
            <figure>
                <img class="Banner" src="../Imagems/Banner Connect Freelas_ Conecte Talentos.png"
                    alt="Logo ConnectFreelas">
            </figure>
        </div>

        <div class="projetos">
            <h2>Projetos em Destaque</h2>

            <div class="lista-projetos">

                <!--Projeto 01 -->
                <article class="card-projeto">
                    <img src="img/design.jpg" alt="Projeto de design">

                    <h3>Criação de identidade visual</h3>

                    <p>Desenvolvimento de logo e identidade visual para empresas.</p>

                    <span>R$ 350,00</span>
                </article>

                <!-- Projeto 02 -->
                <article class="card-projeto">
                    <img src="img/site.jpg" alt="Desenvolvimento de site">

                    <h3>Desenvolvimento de site</h3>

                    <p>Criação de site moderno e responsivo.</p>

                    <span>R$ 600,00</span>
                </article>

            </div>
        </div>

    </main>
