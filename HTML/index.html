<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectFreelas</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>

<body>

    <header>

        <div class="logo">
            <figure>
                <img class="logo" src="../Imagems/Logo ConnectFreelas em Azul Profundo.png" alt="Logo ConnectFreelas">
            </figure>
        </div>

        <div class="Buscar">
            <input type="search" placeholder="Buscar projetos, freelancers ou habilidades...">
            <button type="submit">
                🔍
            </button>
        </div>

        <div class="notificações">
            <button type="button" aria-label="Notificações">
                🔔
            </button>
        </div>

        <div class="Perfil">
            <button type="button" aria-label="Notificações">
                👤
            </button>
        </div>

    </header>

    <div class="menu">
        <nav>
            <ul>
                <li>Início</li>
                <li>Explorar</li>
                <li>Meus Projetos</li>
                <li>Mesagem</li>
                <li>Favoritos</li>
            </ul>
        </nav>
    </div>

    <main>

        <div class="banner">
            <figure>
                <img class="Banner" src="../Imagems/Banner Connect Freelas_ Conecte Talentos.png"
                    alt="Logo ConnectFreelas">
            </figure>
        </div>

        <div class="projetos">
            <h2>Projetos em Destaque</h2>

            <div class="lista-projetos">

                <!--Projeto 01 -->
                <article class="card-projeto">
                    <img src="img/design.jpg" alt="Projeto de design">

                    <h3>Criação de identidade visual</h3>

                    <p>Desenvolvimento de logo e identidade visual para empresas.</p>

                    <span>R$ 350,00</span>
                </article>

                <!-- Projeto 02 -->
                <article class="card-projeto">
                    <img src="img/site.jpg" alt="Desenvolvimento de site">

                    <h3>Desenvolvimento de site</h3>

                    <p>Criação de site moderno e responsivo.</p>

                    <span>R$ 600,00</span>
                </article>

            </div>
        </div>

    </main>

</body>

</html>
