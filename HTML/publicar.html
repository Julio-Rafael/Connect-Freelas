    <main>

        <div class="publicar-titulo">
            <h1>Publicar projeto</h1>
            <p>Descreva o que você precisa e receba propostas de freelancers.</p>
        </div>

        <form class="form-publicar" id="form-publicar" action="#" method="post">

            <div class="campo">
                <label for="titulo">Título do projeto</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ex.: Site institucional para minha empresa"
                    maxlength="80" required>
            </div>

            <div class="campo">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                    <option value="" selected disabled>Escolha uma área</option>
                    <option>Desenvolvimento</option>
                    <option>Design</option>
                    <option>Marketing Digital</option>
                    <option>Redação</option>
                    <option>Audiovisual</option>
                    <option>Suporte e TI</option>
                    <option>Tradução</option>
                </select>
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao" rows="6"
                    placeholder="Explique o que precisa ser feito, o resultado esperado e qualquer detalhe importante."
                    required></textarea>
            </div>

            <div class="campo">
                <label for="habilidades">Habilidades desejadas</label>
                <input type="text" id="habilidades" name="habilidades" placeholder="Ex.: HTML, CSS, JavaScript">
                <small>Separe por vírgula.</small>
            </div>

            <div class="linha-campos">
                <div class="campo">
                    <label for="valor-min">Valor mínimo (R$)</label>
                    <input type="number" id="valor-min" name="valor-min" min="0" step="10" placeholder="400" required>
                </div>
                <div class="campo">
                    <label for="valor-max">Valor máximo (R$)</label>
                    <input type="number" id="valor-max" name="valor-max" min="0" step="10" placeholder="700" required>
                </div>
                <div class="campo">
                    <label for="prazo">Prazo (dias)</label>
                    <input type="number" id="prazo" name="prazo" min="1" placeholder="7" required>
                </div>
            </div>

            <p class="erro" id="erro" hidden></p>
            <p class="sucesso" id="sucesso" hidden>Projeto publicado com sucesso!</p>

            <div class="acoes-form">
                <a href="home.html" class="btn-cancelar">Cancelar</a>
                <button type="submit" class="btn-buscar">Publicar projeto</button>
            </div>
        </form>

    </main>

    <script>
        const form = document.getElementById('form-publicar');
        const erro = document.getElementById('erro');
        const sucesso = document.getElementById('sucesso');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            sucesso.hidden = true;

            const min = Number(form['valor-min'].value);
            const max = Number(form['valor-max'].value);
            if (max < min) {
                erro.textContent = 'O valor máximo não pode ser menor que o mínimo.';
                erro.hidden = false;
                return;
            }

            erro.hidden = true;
            sucesso.hidden = false;
            form.reset();
        });
    </script>
