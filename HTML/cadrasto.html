<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectaFreelas - Cadastro</title>
    <link rel="icon" type="image/x-icon" href="../Imagems/favicon.ico">
    <link rel="stylesheet" href="../CSS/geral.css">
    <link rel="stylesheet" href="../CSS/cadrasto.css">
</head>

<body>

    <header>
        <div class="cabecalho-pagina">
            <div class="logo">
                <figure>
                    <a href="home.html">
                        <img class="logo" src="../Imagems/Logo ConnectFreelas em Azul e Branco.png"
                            alt="Logo ConnectFreelas">
                    </a>
                </figure>
            </div>
        </div>
    </header>

    <main>
        <section class="cadastro">

            <h1>Criar Conta</h1>
            <p>
                Preencha os dados abaixo para se juntar ao Connect Freelas.
            </p>


            <form class="form-cadastro">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(83) 99999-9999" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres" minlength="8"
                        required>
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha"
                        required>
                </div>

                <div class="termos">
                    <label class="check">
                        <input type="checkbox" id="termos" name="termos" required>

                        Li e aceito os
                        <a href="termos.html">Termos de Uso</a>
                        e a
                        <a href="privacidade.html">Política de Privacidade</a>.
                    </label>
                </div>


                <button type="submit">
                    Cadastrar
                </button>
            </form>

        </section>
    </main>
</body>

</html>
